<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 2 7 12 12 22 7 12 2'/><polyline points='2 17 12 22 22 17'/><polyline points='2 12 12 17 22 12'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alpha — AI work, coordinated</title>
    <!--
      Set the theme before first paint.

      React applies it too, but not until the bundle has parsed and mounted.
      That gap is long enough to show a full-screen flash of the wrong palette
      on every load, which is why this runs inline in the head rather than in
      main.tsx. Kept deliberately tiny and dependency-free for the same reason.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('alpha_theme');
          var light =
            saved === 'light' ||
            (saved !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches);
          if (!light) document.documentElement.classList.add('dark');
        } catch (e) {
          // Site data blocked. Fall back to the design's original palette.
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-background text-gray-100 antialiased selection:bg-brand-500/30 selection:text-brand-100 overflow-hidden font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
