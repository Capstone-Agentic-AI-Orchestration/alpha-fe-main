name: CI

on:
  push:
    branches: [main]
  pull_request:

  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment requested by Alpha
        required: false
        default: development
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
