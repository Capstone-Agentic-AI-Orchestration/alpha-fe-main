name: CI

on:
  push:
    branches: [main]
  pull_request:

  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment requested by Alpha
        required: false
        default: development
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Regression tests
        env:
          VITE_API_URL: /api
        run: npm test -- --maxWorkers=2

      - name: Build
        # The web build, as Vercel makes it: requests go to /api on the same
        # origin (middleware.ts). vite.config.ts refuses to build without it.
        env:
          VITE_API_URL: /api
        run: npm run build
